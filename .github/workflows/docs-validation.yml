name: Validate Documentation and Build Project

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Part 1 Folder and Required Files
      run: |
        echo "Checking for Part 1 directory..."
        test -d "Part 1" || { echo "::error::Directory Part 1 does not exist"; exit 1; }

        echo "Checking required documentation files..."
        ls "Part 1" | grep -i 'erd' || { echo "::error::ERD file missing in Part 1"; exit 1; }
        ls "Part 1" | grep -i 'api.*endpoint' || { echo "::error::API endpoint file missing in Part 1"; exit 1; }
        ls "Part 1" | grep -i '\.sql$' || { echo "::error::SQL script file missing in Part 1"; exit 1; }

        echo "All required documentation files are present!"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies for Part 3
      run: dotnet restore Part\ 3/RaceDayManagementAPI.sln

    - name: Build API Solution (Part 3)
      run: dotnet build Part\ 3/RaceDayManagementAPI.sln --no-restore --configuration Release

    - name: Build MVC Web Project (Part 3)
      run: dotnet build Part\ 3/RaceDayManagement.Web/RaceDayManagement.Web.csproj --no-restore --configuration Release
